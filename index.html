<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelito Davids | Guard.Angel · MODMINER · Lurch.AI · SCANTRAK</title>
    <meta name="description" content="Guard.Angel trading protection, MODMINER modular mining platforms, Lurch.AI intelligent analysis, and SCANTRAK precision scanning. Built to protect.">
    <meta name="author" content="Angelito Davids">
    <meta property="og:title" content="Angelito Davids | Guard.Angel · MODMINER · Lurch.AI · SCANTRAK">
    <meta property="og:description" content="The protection layer for your trading system and precision scanning for industry.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --bg-elevated: #0a0a0a;
            --surface: #111111;
            --surface-hover: #1a1a1a;
            --lime: #ccff00;
            --lime-dim: #aacc00;
            --lime-glow: rgba(204,255,0,0.15);
            --text: #ffffff;
            --text-dim: #888888;
            --text-muted: #555555;
            --border: #222222;
            --border-light: #333333;
            --red: #ff4444;
            --green: #00ff88;
            --red-sidebar: #8b1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 64px;
            background: var(--red-sidebar);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 0;
            gap: 1.5rem;
        }
        .sidebar-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sidebar-icon:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .sidebar-icon.active { background: rgba(255,255,255,0.15); color: #fff; }
        .sidebar-top { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
        .sidebar-divider { width: 24px; height: 1px; background: rgba(255,255,255,0.2); margin: 0.5rem 0; }
        .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }

        /* ===== MAIN LAYOUT ===== */
        .main { margin-left: 64px; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0; left: 64px; right: 0;
            height: 72px;
            background: rgba(5,5,5,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
        }
        .logo { display: flex; align-items: center; }
        .wolverine-logo {
            width: 125px;
            height: 40px;
            display: block;
        }
        .wolverine-logo path[stroke="#ff3333"] {
            animation: clawRippleRed 2s ease-in-out infinite;
            transform-origin: center;
        }
        .wolverine-logo g:nth-child(2) path:nth-child(2) {
            animation-delay: 0.08s;
        }
        .wolverine-logo g:nth-child(2) path:nth-child(3) {
            animation-delay: 0.16s;
        }
        @keyframes clawRippleRed {
            0%, 100% { stroke-opacity: 1; filter: drop-shadow(0 0 3px rgba(255,51,51,0.6)); }
            50% { stroke-opacity: 0.7; filter: drop-shadow(0 0 10px rgba(255,51,51,1)); }
        }
        .wolverine-logo ellipse[fill="#ff3333"] {
            animation: bloodDrip 2.5s ease-in-out infinite;
        }
        .wolverine-logo ellipse:nth-child(2) { animation-delay: 0.3s; }
        .wolverine-logo ellipse:nth-child(3) { animation-delay: 0.6s; }
        .wolverine-logo ellipse:nth-child(4) { animation-delay: 0.9s; }
        @keyframes bloodDrip {
            0%, 100% { opacity: 0.8; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(1.5px) scale(1.1); }
        }
        .wolverine-logo circle[fill="#ff3333"] {
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(255,51,51,0.8)); }
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-link:hover { color: var(--lime); }
        
        .nav-cta {
            padding: 0.7rem 1.8rem;
            border: 1px solid var(--border-light);
            background: transparent;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .nav-cta:hover { border-color: var(--lime); color: var(--lime); }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 8rem 3rem 4rem;
            position: relative;
            background: var(--bg);
        }
        .hero-content { max-width: 900px; }
        .hero-label {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 4px;
            text-transform: uppercase; color: var(--lime); margin-bottom: 1.5rem; display: block;
        }
        .hero-title {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 900; line-height: 0.95; letter-spacing: -3px; margin-bottom: 2rem;
        }
        .hero-title .white { color: #fff; display: block; }
        .hero-title .lime { color: var(--lime); display: block; }
        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-dim); max-width: 520px; line-height: 1.7;
            margin-bottom: 3rem; font-weight: 400;
        }
        .hero-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .btn-lime {
            display: inline-flex; align-items: center; gap: 0.75rem;
            padding: 1.1rem 2.2rem; background: var(--lime); color: #000;
            font-size: 0.8rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; text-decoration: none; border: none;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-lime:hover { background: #d4ff1a; transform: translateY(-2px); box-shadow: 0 10px 40px rgba(204,255,0,0.2); }
        .btn-dark {
            display: inline-flex; align-items: center; gap: 0.75rem;
            padding: 1.1rem 2.2rem; background: transparent; color: #fff;
            font-size: 0.8rem; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; text-decoration: none;
            border: 1px solid var(--border-light); cursor: pointer; transition: all 0.3s;
        }
        .btn-dark:hover { border-color: var(--lime); color: var(--lime); }

        /* ===== PROFILE SECTION ===== */
        .profile-section {
            background: var(--bg-elevated);
            padding: 6rem 3rem;
            position: relative;
            overflow: hidden;
        }

        .profile-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('sa-flag-bg_.png') center/cover no-repeat;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        .profile-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, var(--bg-elevated) 0%, transparent 25%, transparent 75%, var(--bg-elevated) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .profile-inner {
            position: relative;
            z-index: 1;
        }
        .profile-inner {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 320px 1fr;
            gap: 4rem; align-items: center;
        }
        .profile-image-wrap {
            position: relative;
        }
        .profile-image {
            width: 280px; height: 280px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--border);
            display: block;
        }
        .profile-image-placeholder {
            width: 280px; height: 280px;
            border-radius: 16px;
            background: var(--surface);
            border: 2px dashed var(--border-light);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            gap: 0.5rem;
        }
        .profile-image-placeholder svg {
            width: 48px; height: 48px;
            stroke: var(--text-muted);
        }
        .profile-image-badge {
            position: absolute;
            bottom: -12px; right: 20px;
            background: var(--lime); color: #000;
            padding: 0.4rem 1rem;
            font-size: 0.7rem; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase;
            border-radius: 4px;
        }
        .profile-text h2 {
            font-size: 2.5rem; font-weight: 900;
            letter-spacing: -2px; margin-bottom: 1rem;
        }
        .profile-text h2 span { color: var(--lime); }
        .profile-text p {
            color: var(--text-dim); line-height: 1.8;
            font-size: 1.05rem; margin-bottom: 1.5rem;
        }
        .profile-role {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: var(--surface); border: 1px solid var(--border);
            padding: 0.5rem 1rem; border-radius: 100px;
            font-size: 0.8rem; color: var(--lime);
            font-weight: 600; letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }
        .profile-socials {
            display: flex; gap: 1rem; margin-top: 1.5rem;
        }
        .profile-socials a {
            width: 44px; height: 44px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .profile-socials a:hover {
            border-color: var(--lime); color: var(--lime);
            transform: translateY(-2px);
        }

        /* ===== CAD SECTION ===== */
        .cad-section {
            background: var(--bg);
            padding: 6rem 3rem;
            position: relative;
            overflow: hidden;
        }

        .cad-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .cad-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .cad-showcase {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            margin-bottom: 3rem;
        }

        .cad-visual {
            position: relative;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cad-grid-bg {
            position: relative;
            width: 320px;
            height: 320px;
            perspective: 800px;
        }

        .cad-axis {
            position: absolute;
            background: var(--border-light);
        }

        .cad-axis.x-axis {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }

        .cad-axis.y-axis {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        .cad-axis.z-axis {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: rotateZ(45deg);
            transform-origin: center;
        }

        .cad-cube {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) rotateX(-20deg) rotateY(35deg);
            animation: cadRotate 8s linear infinite;
        }

        @keyframes cadRotate {
            from { transform: translate(-50%, -50%) rotateX(-20deg) rotateY(0deg); }
            to { transform: translate(-50%, -50%) rotateX(-20deg) rotateY(360deg); }
        }

        .cube-face {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(204, 255, 0, 0.05);
            border: 1px solid rgba(204, 255, 0, 0.3);
        }

        .cube-face.front  { transform: translateZ(60px); }
        .cube-face.back   { transform: translateZ(-60px) rotateY(180deg); }
        .cube-face.left   { transform: translateX(-60px) rotateY(-90deg); }
        .cube-face.right  { transform: translateX(60px) rotateY(90deg); }
        .cube-face.top    { transform: translateY(-60px) rotateX(90deg); }
        .cube-face.bottom { transform: translateY(60px) rotateX(-90deg); }

        .cad-dim {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .cad-dim .dim-line {
            width: 40px;
            height: 1px;
            background: var(--text-muted);
            position: relative;
        }

        .cad-dim .dim-line::before,
        .cad-dim .dim-line::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 6px;
            background: var(--text-muted);
            top: -2.5px;
        }

        .cad-dim .dim-line::before { left: 0; }
        .cad-dim .dim-line::after { right: 0; }

        .cad-dim.dim-x { bottom: 20px; left: 50%; transform: translateX(-50%); }
        .cad-dim.dim-y { right: 10px; top: 50%; transform: translateY(-50%) rotate(90deg); }
        .cad-dim.dim-z { top: 10px; left: 20px; }

        .cad-skills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .cad-skill-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.8rem;
            transition: all 0.3s;
        }

        .cad-skill-card:hover {
            border-color: var(--lime);
            transform: translateY(-3px);
        }

        .cad-skill-card::before {
            content: '';
            display: block;
            width: 100%;
            height: 2px;
            background: var(--lime);
            margin-bottom: 1rem;
            border-radius: 1px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .cad-skill-card:hover::before {
            opacity: 1;
        }

        .cad-skill-icon {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }

        .cad-skill-card h4 {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .cad-skill-card p {
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .cad-cta {
            text-align: center;
            margin-top: 2rem;
        }

        /* ===== 3D PANEL SECTION ===== */
        .panel-section {
            background: var(--bg);
            padding: 6rem 3rem;
            perspective: 1200px;
            overflow: hidden;
        }
        .panel-inner {
            max-width: 1200px; margin: 0 auto;
        }
        .panel-header {
            text-align: center; margin-bottom: 3rem;
        }
        .panel-header .section-label { margin-bottom: 1rem; }
        .panel-header h2 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 900; letter-spacing: -2px;
        }
        .panel-header h2 span { color: var(--lime); }
        .panel-header p {
            color: var(--text-dim); margin-top: 1rem;
            font-size: 1.05rem;
        }

        /* 3D Terminal */
        .terminal-3d-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
            transform-style: preserve-3d;
        }
        .terminal-3d {
            width: 100%; max-width: 900px;
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            transform: rotateX(5deg) rotateY(-3deg);
            transform-style: preserve-3d;
            box-shadow:
                0 40px 80px rgba(0,0,0,0.6),
                0 0 0 1px rgba(204,255,0,0.05),
                inset 0 1px 0 rgba(255,255,255,0.03);
            transition: transform 0.6s ease;
        }
        .terminal-3d:hover {
            transform: rotateX(2deg) rotateY(-1deg) translateZ(20px);
        }
        .terminal-3d::before {
            content: '';
            position: absolute;
            top: -1px; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--lime), transparent);
            border-radius: 2px;
        }

        .terminal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem; color: var(--lime);
            letter-spacing: 2px;
        }
        .terminal-status {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.75rem; color: var(--green);
            font-family: 'JetBrains Mono', monospace;
        }
        .status-dot {
            width: 8px; height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .terminal-body {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 2rem;
        }

        /* Chart Area */
        .chart-area {
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            min-height: 320px;
        }
        .chart-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem;
        }
        .chart-pair {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem; font-weight: 700;
            color: #fff;
        }
        .chart-pair span { color: var(--text-muted); font-weight: 400; }
        .chart-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem; font-weight: 700;
        }
        .chart-price.up { color: var(--green); }
        .chart-price.down { color: var(--red); }

        .chart-canvas {
            position: relative;
            height: 220px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            padding-bottom: 30px;
        }
        .candle {
            flex: 1;
            min-width: 8px;
            border-radius: 2px;
            position: relative;
            transition: all 0.3s;
        }
        .candle.green { background: var(--green); }
        .candle.red { background: var(--red); }
        .candle.wick {
            position: absolute;
            width: 1px;
            left: 50%;
            transform: translateX(-50%);
            background: inherit;
            opacity: 0.6;
        }

        .sl-line, .tp-line {
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            padding: 0 8px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            letter-spacing: 1px;
        }
        .sl-line {
            background: repeating-linear-gradient(90deg, var(--red) 0, var(--red) 5px, transparent 5px, transparent 10px);
            color: var(--red);
            bottom: 60px;
        }
        .tp-line {
            background: repeating-linear-gradient(90deg, var(--green) 0, var(--green) 5px, transparent 5px, transparent 10px);
            color: var(--green);
            bottom: 160px;
        }
        .entry-line {
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background: var(--lime);
            bottom: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--lime);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 8px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(204,255,0,0.3);
        }

        /* Control Panel */
        .control-panel {
            display: flex; flex-direction: column; gap: 1rem;
        }
        .panel-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
        }
        .panel-card h4 {
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 1rem;
        }

        .trade-btns {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
        }
        .trade-btn {
            padding: 1rem;
            border: none; border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .trade-btn.buy {
            background: rgba(0,255,136,0.1);
            color: var(--green);
            border: 1px solid rgba(0,255,136,0.3);
        }
        .trade-btn.buy:hover {
            background: rgba(0,255,136,0.2);
            box-shadow: 0 0 20px rgba(0,255,136,0.2);
        }
        .trade-btn.sell {
            background: rgba(255,68,68,0.1);
            color: var(--red);
            border: 1px solid rgba(255,68,68,0.3);
        }
        .trade-btn.sell:hover {
            background: rgba(255,68,68,0.2);
