<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #ddd;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  a.card:hover {
    border-color: #ccff00;
    transform: translateY(-4px);
  }
  .number {
    color: #555;
    font-size: 0.75rem;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .logo-wrap {
    width: 100px;
    height: 100px;
    border: 2px solid #ccff00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    position: relative;
  }
  .logo-wrap::before {
    content: '';
    position: absolute;
    width: 80px;
    height: 80px;
    border: 1px solid rgba(204,255,0,0.3);
    border-radius: 50%;
  }
  .logo-wrap::after {
    content: '';
    position: absolute;
    width: 60px;
    height: 60px;
    border: 1px solid rgba(204,255,0,0.15);
    border-radius: 50%;
  }
  .logo-m {
    color: #ccff00;
    font-size: 2.5rem;
    font-weight: 900;
    font-family: Impact, 'Arial Black', sans-serif;
    z-index: 1;
  }
  h1 {
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 2.2rem;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .brand {
    color: #ccff00;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  p {
    color: #888;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .tags {
    display: flex;
    gap: 10px;
  }
  .tag {
    border: 1px solid #333;
    color: #777;
    padding: 5px 14px;
    border-radius: 4px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
</style>
</head>
<body>

<a href="saber/index.html" class="card">
  <div class="number">02</div>
  <div class="logo-wrap">
    <span class="logo-m">M</span>
  </div>
  <h1>MODMINER</h1>
  <div class="brand">MODKRAFT</div>
  <p>Heavy-duty tracked mining platform engineered around modularity, material handling, and field serviceability.</p>
  <div class="tags">
    <span class="tag">Modular</span>
    <span class="tag">Heavy Duty</span>
  </div>
</a>

</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABER / ModMiner — 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08080d;
    color: #ddd;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #viewer-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  #viewer-label {
    position: absolute;
    top: 16px;
    left: 20px;
    z-index: 10;
    pointer-events: none;
  }
  #viewer-label h1 {
    font-size: 1.4rem;
    color: #00d4ff;
    margin-bottom: 4px;
  }
  #viewer-label p {
    font-size: 0.8rem;
    color: #888;
  }
  #back-btn {
    position: absolute;
    top: 16px;
    right: 20px;
    z-index: 10;
    background: transparent;
    border: 1px solid #333;
    color: #888;
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  #back-btn:hover {
    border-color: #ccff00;
    color: #ccff00;
  }
  canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
</head>
<body>

<div id="viewer-wrap">
  <div id="viewer-label">
    <h1>SABER / ModMiner</h1>
    <p>Drag to rotate &middot; Scroll to zoom &middot; Right-click to pan</p>
  </div>
  <a href="../index.html" id="back-btn">&larr; Back</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script>
  const container = document.getElementById('viewer-wrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x08080d);
  scene.fog = new THREE.Fog(0x08080d, 8000, 35000);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 50000);
  camera.position.set(9000, 7000, 9000);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 1500, 0);
  controls.maxDistance = 30000;

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));

  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(6000, 12000, 6000);
  dir.castShadow = true;
  scene.add(dir);

  const fill = new THREE.DirectionalLight(0x00d4ff, 0.25);
  fill.position.set(-6000, 4000, -6000);
  scene.add(fill);

  const grid = new THREE.GridHelper(30000, 30, 0x222233, 0x0e0e18);
  scene.add(grid);

  const loader = new THREE.OBJLoader();
  loader.load(
    'Saber_ModMiner.obj',
    function (object) {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      object.position.sub(center);
      object.position.y += 500;

      object.traverse(function (child) {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (!child.material) {
            child.material = new THREE.MeshStandardMaterial({ color: 0x888899 });
          }
        }
      });

      scene.add(object);
      const size = box.getSize(new THREE.Vector3());
      controls.maxDistance = Math.max(size.x, size.y, size.z) * 4;
    },
    undefined,
    function () {
      const geo = new THREE.BoxGeometry(2000, 2000, 2000);
      const mat = new THREE.MeshStandardMaterial({ color: 0xe94560, wireframe: true });
      const cube = new THREE.Mesh(geo, mat);
      cube.position.y = 1000;
      scene.add(cube);
    }
  );

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
