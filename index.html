<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelito Davids</title>
    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        /* SA FLAG IMAGE ROUND BACKGROUND */
        .profile-wrap {
            padding: 12px;
            background-image: url('sa-flag-bg_.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: inline-block;
        }
        
        /* ROUND PHOTO */
        .profile-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #050505;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 20px;
            color: #ffffff;
        }
        h1 span {
            color: #ccff00;
        }
    </style>
</head>
<body>

    <!-- Your photo with SA Flag Background -->
    <div class="profile-wrap">
        <img src="profile.png" alt="Angelito Davids" class="profile-photo">
    </div>

    <h1>ANGELITO <span>DAVIDS</span></h1>

</body>
</html>
