    <style>
        :root {
            --bg: #050505;
            --bg-elevated: #0a0a0a;
            --surface: #111111;
            --surface-hover: #1a1a1a;
            --lime: #ccff00;
            --text: #ffffff;
            --text-dim: #888888;
            --text-muted: #555555;
            --border: #222222;
            --border-light: #333333;
            --red-sidebar: #8b1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 64px;
            background: var(--red-sidebar);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 0;
            gap: 1.5rem;
        }
        .sidebar-icon {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sidebar-icon:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .sidebar-top { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
        .sidebar-divider { width: 24px; height: 1px; background: rgba(255,255,255,0.2); margin: 0.5rem 0; }
        .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }

        .main { margin-left: 64px; }

        .navbar {
            position: fixed;
            top: 0; left: 64px; right: 0;
            height: 72px;
            background: rgba(5,5,5,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
        }

        .nav-links { display: flex; align-items: center; gap: 1.5rem; }
        .nav-link { color: var(--text-dim); text-decoration: none; font-size: 0.8rem; font-weight: 600; transition: color 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link:hover { color: var(--lime); }

        .nav-cta {
            padding: 0.7rem 1.8rem;
            border: 1px solid var(--border-light);
            background: transparent;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
        }
        .nav-cta:hover { border-color: var(--lime); color: var(--lime); }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 8rem 3rem 4rem;
            background: var(--bg);
        }
        .hero-content { max-width: 900px; }
        .hero-label {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 4px;
            text-transform: uppercase; color: var(--lime); margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: clamp(3.5rem, 9vw, 7rem);
            font-weight: 900; line-height: 0.95; letter-spacing: -3px; margin-bottom: 2rem;
        }
        .hero-title .white { color: #fff; display: block; }
        .hero-title .lime { color: var(--lime); display: block; }

        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-dim); max-width: 520px; line-height: 1.7;
            margin-bottom: 3rem;
        }

        .btn-lime {
            display: inline-flex; align-items: center; gap: 0.75rem;
            padding: 1.1rem 2.2rem; background: var(--lime); color: #000;
            font-size: 0.8rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; text-decoration: none; border: none;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-lime:hover { background: #d4ff1a; transform: translateY(-2px); box-shadow: 0 10px 40px rgba(204,255,0,0.2); }

        .btn-dark {
            display: inline-flex; align-items: center; gap: 0.75rem;
            padding: 1.1rem 2.2rem; background: transparent; color: #fff;
            font-size: 0.8rem; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; text-decoration: none;
            border: 1px solid var(--border-light); cursor: pointer; transition: all 0.3s;
        }
        .btn-dark:hover { border-color: var(--lime); color: var(--lime); }

        .profile-section {
            background: var(--bg-elevated);
            padding: 6rem 3rem;
            position: relative;
            overflow: hidden;
        }

        .profile-inner {
            position: relative; z-index: 1;
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 320px 1fr;
            gap: 4rem; align-items: center;
        }

        /* FIX: SA FLAG BEHIND PROFILE PICTURE using your actual image file */
        .profile-image-wrap {
            position: relative;
            padding: 10px; /* The thickness of the flag border */
            
            /* Pulls your actual flag image file from your repo */
            background-image: url('sa-flag-bg_.png');
            background-size: cover;
            background-position: center;
            
            border-radius: 20px; /* Rounded corners for the flag */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: inline-block;
        }

        .profile-image {
            width: 280px; height: 280px;
            border-radius: 14px; object-fit: cover;
            border: 4px solid var(--bg); /* Dark frame around the photo */
            display: block;
            position: relative;
            z-index: 2;
        }

        .profile-image-badge {
            position: absolute; bottom: 0px; right: 0px;
            background: var(--lime); color: #000;
            padding: 0.4rem 1rem; font-size: 0.7rem; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase; border-radius: 4px;
            z-index: 3;
        }

        .profile-text h2 { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 1rem; }
        .profile-text h2 span { color: var(--lime); }
        .profile-text p { color: var(--text-dim); line-height: 1.8; font-size: 1.05rem; margin-bottom: 1.5rem; }
        .profile-role {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: var(--surface); border: 1px solid var(--border);
            padding: 0.5rem 1rem; border-radius: 100px;
            font-size: 0.8rem; color: var(--lime);
            font-weight: 600; letter-spacing: 1px; margin-bottom: 1.5rem;
        }
        .profile-socials { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .profile-socials a {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--surface); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); text-decoration: none; font-size: 1.1rem; transition: all 0.3s;
        }
        .profile-socials a:hover { border-color: var(--lime); color: var(--lime); transform: translateY(-2px); }

        section { padding: 6rem 3rem; max-width: 1200px; margin: 0 auto; }
        .section-label {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 4px;
            text-transform: uppercase; color: var(--lime); margin-bottom: 1.5rem;
        }
        .section-title {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 900; letter-spacing: -2px; line-height: 1.1; margin-bottom: 1.5rem;
        }
        .section-title .lime { color: var(--lime); }
        .section-desc { color: var(--text-dim); font-size: 1.1rem; line-height: 1.7; max-width: 600px; }

        .products { background: var(--bg-elevated); }
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem; margin-top: 4rem;
        }
        .product-card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 2.5rem; transition: all 0.4s ease; position: relative;
        }
        .product-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 2px; background: var(--lime);
            transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease;
        }
        .product-card:hover::before { transform: scaleX(1); }
        .product-card:hover { border-color: var(--border-light); background: var(--surface-hover); }
        .product-number {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 3px;
            color: var(--lime); margin-bottom: 1rem;
        }
        .product-card h3 { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0.3rem; }
        .product-card .brand {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 3px;
            color: var(--text-muted); text-transform: uppercase; margin-bottom: 1.5rem;
        }
        .product-card p { color: var(--text-dim); line-height: 1.7; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .product-features li {
            padding: 0.5rem 0; color: var(--text-dim); font-size: 0.85rem;
            display: flex; align-items: center; gap: 0.75rem;
        }
        .product-features li::before {
            content: ''; width: 6px; height: 6px;
            background: var(--lime); border-radius: 50%;
        }

        /* SCANTRAK SECTION */
        .scantrak-section { background: var(--bg-elevated); padding: 6rem 3rem; }
        .scantrak-header { text-align: center; margin-bottom: 4rem; }
        .scantrak-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 3rem; }
        .scantrak-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 2rem 1.5rem; text-align: center; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .scantrak-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: var(--border); transition: all 0.3s;
        }
        .scantrak-card:hover::before { background: var(--lime); box-shadow: 0 0 15px rgba(204,255,0,0.2); }
        .scantrak-card:hover { border-color: var(--border-light); transform: translateY(-4px); }
        .scantrak-icon { font-size: 2.5rem; margin-bottom: 1rem; line-height: 1; }
        .scantrak-card h4 { font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--lime); margin-bottom: 0.75rem; }
        .scantrak-card p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; }

        .fade-up { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        footer { background: var(--bg-elevated); border-top: 1px solid var(--border); padding: 5rem 3rem 3rem; margin-left: 64px; }
        .footer-inner { max-width: 1200px; margin: 0 auto; text-align: center; }
        .footer-logo { font-size: 2rem; font-weight: 900; letter-spacing: -2px; color: #fff; margin-bottom: 1rem; }
        .footer-logo span { color: var(--lime); }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s; }
        .footer-links a:hover { color: var(--lime); }

        @media (max-width: 1024px) { .profile-inner { grid-template-columns: 1fr; text-align: center; } .profile-image-wrap { display: flex; justify-content: center; margin: 0 auto; } .profile-socials { justify-content: center; } }
        @media (max-width: 900px) { .sidebar { display: none; } .main { margin-left: 0; } .navbar { left: 0; } .scantrak-grid { grid-template-columns: 1fr 1fr; } footer { margin-left: 0; } }
        @media (max-width: 600px) { .navbar { padding: 0 1.5rem; } section, .hero { padding: 4rem 1.5rem; } .hero { padding-top: 5rem; } .scantrak-grid { grid-template-columns: 1fr; } }
    </style>
