<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABER / ModMiner — 3D Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: sans-serif; }
  #info {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    color: #00d4ff; pointer-events: none;
  }
  #info h1 { margin: 0; font-size: 1.2rem; }
  #info p { margin: 4px 0 0; font-size: 0.8rem; color: #888; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="info">
  <h1>SABER / ModMiner</h1>
  <p>Drag to rotate • Scroll to zoom • Right-click to pan</p>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- OBJLoader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script>
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.Fog(0x0a0a0f, 5000, 25000);

  // Camera
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 50000);
  camera.position.set(8000, 6000, 8000);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 1500, 0);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5000, 10000, 5000);
  dir.castShadow = true;
  scene.add(dir);

  const fill = new THREE.DirectionalLight(0x00d4ff, 0.3);
  fill.position.set(-5000, 3000, -5000);
  scene.add(fill);

  // Ground grid
  const grid = new THREE.GridHelper(30000, 30, 0x222233, 0x111118);
  scene.add(grid);

  // Load OBJ
  const loader = new THREE.OBJLoader();
  loader.load(
    'Saber_ModMiner.obj',
    function (object) {
      // Center the model
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      object.position.sub(center);
      object.position.y += 500; // sit on grid

      // Colorize by material names (optional fallback)
      object.traverse(function (child) {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          // If no material color, give it a default
          if (!child.material.color || child.material.color.getHex() === 0xffffff) {
            child.material.color.setHex(0x888899);
          }
        }
      });

      scene.add(object);
      console.log('Model loaded');
    },
    function (xhr) {
      console.log((xhr.loaded / xhr.total * 100) + '% loaded');
    },
    function (err) {
      console.error('Error loading OBJ', err);
      // Fallback: show a placeholder cube if OBJ missing
      const geo = new THREE.BoxGeometry(1000, 1000, 1000);
      const mat = new THREE.MeshStandardMaterial({ color: 0xe94560 });
      const cube = new THREE.Mesh(geo, mat);
      cube.position.y = 500;
      scene.add(cube);
    }
  );

  // Resize handler
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
